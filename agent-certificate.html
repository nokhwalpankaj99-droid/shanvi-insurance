<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub-Agent Certificate | Shanvi</title><link rel="stylesheet" href="style.css"></head><body><main class="certificate-page"><div id="certificate" class="certificate"></div><div id="certificateError" class="notice" style="display:none;max-width:900px;margin:18px auto">Certificate data not available in this browser. Please login from the same portal/browser where Admin issued the certificate, or ask Admin to re-issue it.</div><div class="actions center"><button class="btn primary" onclick="window.print()">📥 Download / Save Certificate as PDF</button><a class="btn light" href="agent-login.html">Continue to Agent Login</a></div></main><script src="supabase-config.js"></script><script src="script.js"></script><script>const params=new URLSearchParams(location.search);const requestedUid=params.get('uid');let u=requestedUid?load('shanviAgents',[]).find(x=>x.uid===requestedUid):currentAgent();if(requestedUid){if(localStorage.getItem('shanviAdmin')!=='1'||!guardPortalSession('admin','admin-login.html')){u=null}}else{if(!u||!guardPortalSession('agent','agent-login.html'))u=null}if(!u){document.getElementById('certificateError').style.display='block';}else if(!u.certificateIssued||u.certificateRejected||u.deactivated){document.getElementById('certificateError').style.display='block';document.getElementById('certificateError').innerHTML='⏳ Certificate is not currently issued/active. Please ask Admin to issue or re-issue the certificate.';}else{store('shanviCurrentAgent',u.uid);document.getElementById('certificate').innerHTML=`<div class="cert-head"><div class="logo">🛡️</div><div><h1>Shanvi Insurance Services</h1><p>Sub-Agent Appointment Certificate</p></div></div><div class="cert-body"><h2>CERTIFICATE OF AUTHORISED SUB-AGENT</h2><p>This certificate is issued to</p><h3>${u.name}</h3><p>Sub-Agent Code</p><div class="cert-code">${u.code}</div><p>Email: ${u.email} &nbsp; | &nbsp; Mobile: ${u.mobile}</p><p>Certificate No.: ${u.certificateNo}</p><p>Issued: ${new Date(u.issuedAt).toLocaleDateString('en-IN')}</p><div class="cert-note">This certificate confirms appointment/registration with Shanvi Insurance Services for authorised insurance assistance, subject to applicable rules, verification and internal approval.</div><div class="cert-signatures"><div class="official-signature"><div class="signature-script">Shanvi Insurance Services</div><div class="signature-line">Authorised Signatory<br>Shanvi Insurance Services</div></div></div></div><div class="cert-foot"><b>Shanvi Insurance Services</b><br>${SHANVI.address}<br>${SHANVI.supportPhone} · ${SHANVI.supportEmail}</div>`}</script></body></html>
