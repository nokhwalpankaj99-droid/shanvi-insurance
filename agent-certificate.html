<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Certificate | Shanvi</title><link rel="stylesheet" href="style.css"></head><body><main class="certificate-page"><div id="certificate" class="certificate"></div><div class="actions center"><button class="btn primary" onclick="window.print()">📥 Download / Save Certificate as PDF</button><a class="btn light" href="agent-login.html">Continue to Agent Login</a></div></main><script src="script.js"></script><script>const params=new URLSearchParams(location.search);const requestedUid=params.get('uid');let u=requestedUid?load('shanviAgents',[]).find(x=>x.uid===requestedUid):currentAgent();if(requestedUid){if(localStorage.getItem('shanviAdmin')!=='1'||!guardPortalSession('admin','admin-login.html')){u=null}}else{if(!u||!guardPortalSession('agent','agent-login.html'))u=null}if(!u){location.href=requestedUid?'admin-login.html':'agent-login.html'}else if(!u.certificateIssued||u.certificateRejected||u.deactivated){location.href=requestedUid?'admin-portal.html':'agent-login.html'}else{store('shanviCurrentAgent',u.uid);document.getElementById('certificate').innerHTML=`<div class="cert-head"><div class="logo">🛡️</div><div><h1>Shanvi Insurance Services</h1><p>Agent Appointment Certificate</p></div></div><div class="cert-body"><h2>CERTIFICATE OF AUTHORISED AGENT</h2><p>This certificate is issued to</p><h3>${u.name}</h3><p>Agent Code</p><div class="cert-code">${u.code}</div><p>Email: ${u.email} &nbsp; | &nbsp; Mobile: ${u.mobile}</p><p>Certificate No.: ${u.certificateNo}</p><p>Issued: ${new Date(u.issuedAt).toLocaleDateString('en-IN')}</p><div class="cert-note">This certificate confirms appointment/registration with Shanvi Insurance Services for authorised insurance assistance, subject to applicable rules, verification and internal approval.</div><div class="cert-signatures"><div><div style="height:42px"></div><div class="signature-line">Authorised Signatory<br>Shanvi Insurance Services</div></div><div><div style="height:42px"></div><div class="signature-line">Agent Acknowledgement<br>${u.name}</div></div></div></div><div class="cert-foot"><b>Shanvi Insurance Services</b><br>${SHANVI.address}<br>${SHANVI.supportPhone} · ${SHANVI.supportEmail}</div>`}</script></body></html>
