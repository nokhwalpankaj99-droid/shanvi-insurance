<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accounting Exam | Shree Balaji Accounting</title>
<style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#172033}header{background:#0b3d91;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#fff;padding:24px;border-radius:14px;margin:20px 0;border:1px solid #dbe5f2}button{background:#0b3d91;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer}.option{display:block;padding:12px;border:1px solid #dbe5f2;border-radius:8px;margin:8px 0}.cert{border:8px double #0b3d91;padding:35px;text-align:center;background:#fff}</style></head>
<body><header><img src="assets/smart-tax-solution-logo.png" alt="Smart Tax Solution" style="max-width:280px;width:100%;background:#fff;border-radius:8px;margin-bottom:12px"><div class="wrap"><h1>Shree Balaji Accounting</h1><div>Accounting & Tax Practical Examination</div></div><div style="max-width:900px;margin:10px auto"><a href="tax-gst.html" style="color:#fff">← Back to Smart Tax Solution</a></div></header>
<main class="wrap"><div class="card" id="start"><h2>Start Accounting Exam</h2><input id="name" placeholder="Student full name" style="padding:12px;width:90%"><p>20 questions • Passing score 70%</p><button onclick="begin()">Start Exam</button></div>
<div class="card" id="exam" style="display:none"><div id="qs"></div><button onclick="finish()">Submit Exam</button></div><div class="card" id="out" style="display:none"></div></main>
<script>
const Q=[
["The accounting equation is:","Assets = Liabilities + Equity","Assets = Revenue + Expense","Liabilities = Assets + Revenue","Equity = Assets + Expense"],
["A debit generally increases:","Assets","Revenue","Capital","Liabilities"],
["A credit generally increases:","Revenue","Assets","Drawings","Expenses"],
["Trial balance is prepared primarily to check:","Arithmetical agreement of ledger balances","Profit tax rate","Bank interest","GST registration"],
["Depreciation is:","Allocation of depreciable cost over useful life","Cash received from customer","Owner withdrawal","Tax collected"],
["GST is a:","Consumption-based indirect tax","Direct tax on salary only","Property tax","Customs-only tax"],
["TDS means:","Tax Deducted at Source","Tax Deposit Statement","Total Duty Schedule","Tax Data Sheet"],
["Balance sheet shows:","Financial position at a point in time","Only cash sales","Only purchases","Only tax payments"],
["Profit and loss statement reports:","Income and expenses for a period","Assets only","Liabilities only","Bank balance only"],
["Working capital is commonly:","Current assets minus current liabilities","Fixed assets minus capital","Sales minus purchases","Cash plus drawings"],
["Outstanding expense is generally:","Expense incurred but not yet paid","Income received in advance","Asset sold","Capital introduced"],
["Prepaid expense is:","Payment made in advance for a future expense","Expense unpaid","Revenue earned","Loan received"],
["Bank reconciliation compares:","Cash book and bank statement balances","Sales and purchases","Assets and liabilities","GST and TDS"],
["Input tax credit under GST is subject to:","Eligibility and statutory conditions","No conditions","Only cash sales","Only salary payment"],
["An invoice primarily records:","A sale or supply transaction","A personal diary entry","A bank password","A tax audit appointment"],
["Capital introduced by owner increases:","Equity and usually assets/cash","Expenses only","Liabilities only","Revenue only"],
["Closing stock is relevant to:","Determining cost of goods sold/profit and balance-sheet presentation","TDS only","Bank reconciliation only","Payroll only"],
["A ledger contains:","Account-wise transaction postings","Only invoices","Only tax returns","Only bank statements"],
["Accrual accounting recognizes income/expense when:","Earned/incurred subject to applicable accounting rules","Only when cash moves","Only at year-end","Never"],
["Audit evidence is used to:","Support audit conclusions","Create GSTIN","Open a bank account","Issue PAN"]
];
function begin(){if(!document.getElementById('name').value.trim()){alert('Please enter student name');return}document.getElementById('start').style.display='none';document.getElementById('exam').style.display='block';let h='';Q.forEach((q,i)=>{h+=`<section><h3>${i+1}. ${q[0]}</h3>`;q.slice(1).forEach((o,j)=>h+=`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`) });document.getElementById('qs').innerHTML=h}
function finish(){let score=0;const details=Q.map((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);const selected=a?+a.value:null;const ok=selected===0;if(ok)score++;return {no:i+1,question:q[0],studentAnswer:selected===null?'Not Attempted':q[selected+1],correctAnswer:q[1],status:ok?'Correct':'Wrong / Not Attempted'};});const pct=Math.round(score/Q.length*100),name=document.getElementById('name').value.trim(),cert='STS2026S02317';if(pct>=70){const rec={certificateNo:cert,name,score:`${score}/${Q.length} (${pct}%)`,status:'Issued',academy:'Shree Balaji Accounting',issuer:'Smart Tax Solution',founder:'Adv. Pankaj Nokhwal',date:new Date().toLocaleDateString('en-IN'),details};let rs=[];try{rs=JSON.parse(localStorage.getItem('stsCertificates')||'[]')}catch(e){}const ix=rs.findIndex(x=>x.certificateNo===cert&&x.name===name);if(ix>=0)rs[ix]=rec;else rs.push(rec);localStorage.setItem('stsCertificates',JSON.stringify(rs));localStorage.setItem('lastExamResult',JSON.stringify(rec));}document.getElementById('exam').style.display='none';const out=document.getElementById('out');out.style.display='block';out.innerHTML=`<div class="cert"><img src="assets/smart-tax-solution-logo.png" alt="Smart Tax Solution" style="max-width:250px;width:100%"><h1>${pct>=70?'Certificate of Achievement':'Exam Result'}</h1><h2>Shree Balaji Accounting</h2><p><b>Student:</b> ${name}</p><p><b>Score:</b> ${score}/${Q.length} (${pct}%)</p><p><b>Result:</b> ${pct>=70?'PASS':'NOT PASSED'}</p>${pct>=70?`<p><b>Certificate Number:</b> ${cert}</p><p><b>Date:</b> ${new Date().toLocaleDateString('en-IN')}</p><p>Accounting & Tax Practical Examination successfully completed.</p><p><b>Smart Tax Solution</b><br>Adv. Pankaj Nokhwal<br>Founder</p><button onclick="printCertificate()">Print / Save Certificate</button> <button onclick="openMarksheet()">View Professional Marksheet</button> <a href="verify-certificate.html" style="display:inline-block;background:#0b3d91;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none">Verify Certificate</a>`:`<p>Passing score is 70%. Please review the course material and retake the exam.</p><button onclick="location.reload()">Retake Exam</button>`}</div>`}
function openMarksheet(){const name=document.getElementById('name').value.trim(),score=Q.filter((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);return a&&+a.value===0}).length,pct=Math.round(score/Q.length*100);const rows=Q.map((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`),sel=a?+a.value:null,ok=sel===0;return `<tr><td>${i+1}</td><td>${q[0]}</td><td>${sel===null?'Not Attempted':q[sel+1]}</td><td>${q[1]}</td><td class="${ok?'ok':'wrong'}">${ok?'CORRECT':'WRONG'}</td></tr>`}).join('');const w=window.open('','_blank','width=1000,height=1000');w.document.write(`<!doctype html><html><head><title>Marksheet - ${name}</title><style>@page{size:A4 portrait;margin:12mm}body{font-family:Arial;background:#eef3f9;color:#18243a}.sheet{max-width:900px;margin:20px auto;background:#fff;padding:28px;border:3px solid #0b3d91}.head{text-align:center;border-bottom:2px solid #0b3d91;padding-bottom:15px}.head img{max-width:210px}.school{font-size:26px;font-weight:800;color:#0b3d91}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #bfcde0;padding:12px;margin:18px 0}.meta b{display:block}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #9fb0c6;padding:7px;vertical-align:top}th{background:#dfeaf7;color:#0b3d91}.ok{color:#17723a;font-weight:800}.wrong{color:#b12020;font-weight:800}.result{text-align:center;font-size:20px;padding:12px;background:#eaf2ff;margin-bottom:15px}</style></head><body><div class="sheet"><div class="head"><img src="assets/smart-tax-solution-logo.png"><div class="school">SHREE BALAJI ACCOUNTING</div><h2>ACCOUNTING & TAX PRACTICAL EXAMINATION</h2><b>OFFICIAL EXAMINATION MARKSHEET</b></div><div class="meta"><div><b>Student Name</b>${name}</div><div><b>Certificate No.</b>STS2026S02317</div><div><b>Maximum Marks</b>20</div><div><b>Passing Marks</b>14 (70%)</div><div><b>Marks Obtained</b>${score}</div><div><b>Percentage</b>${pct}%</div><div><b>Result</b>${pct>=70?'PASS':'NOT PASSED'}</div><div><b>Date</b>${new Date().toLocaleDateString('en-IN')}</div></div><div class="result">${pct>=70?'PASS — Congratulations':'NOT PASSED'} | ${score}/20 | ${pct}%</div><table><tr><th>No.</th><th>Question</th><th>Student Answer</th><th>Correct Answer</th><th>Evaluation</th></tr>${rows}</table><p style="text-align:center"><button onclick="window.print()">Print / Save PDF</button></p></div></body></html>`);w.document.close()}
function printCertificate(){const name=document.getElementById('name').value.trim(),score=Q.filter((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);return a&&+a.value===0}).length,pct=Math.round(score/Q.length*100);if(pct<70)return;const w=window.open('','_blank','width=1100,height=800');w.document.write(`<!doctype html><html><head><title>Certificate - ${name}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Georgia,serif;background:#f2f5f9;text-align:center}.cert{background:#fff;border:10px double #0b3d91;min-height:540px;padding:35px}.logo{max-width:230px}.title{font-size:42px;color:#0b3d91}.sub{letter-spacing:3px;color:#68778e}.name{font-size:36px;font-weight:800;border-bottom:2px solid #b18a4d;display:inline-block;padding:8px 60px}.seal{font-size:14px;border:3px solid #b18a4d;border-radius:50%;width:100px;height:100px;display:grid;place-items:center;margin:18px auto;color:#0b3d91;font-weight:800}.footer{display:flex;justify-content:space-between;text-align:left;margin-top:25px;font-size:13px}</style></head><body><div class="cert"><img class="logo" src="assets/smart-tax-solution-logo.png"><div class="sub">SHREE BALAJI ACCOUNTING</div><div class="title">CERTIFICATE OF COMPLETION</div><p>This certificate is proudly presented to</p><div class="name">${name}</div><p>for successfully passing the <b>Accounting & Tax Practical Examination</b>.</p><p><b>Score: ${score}/20 (${pct}%)</b><br>Certificate Number: <b>STS2026S02317</b><br>Date: ${new Date().toLocaleDateString('en-IN')}</p><div class="seal">CERTIFIED<br>ACADEMY</div><div class="footer"><span><b>Adv. Pankaj Nokhwal</b><br>Founder, Smart Tax Solution</span><span><b>Shree Balaji Accounting</b><br>Course Completion Certificate</span></div></div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
</script></body></html>
