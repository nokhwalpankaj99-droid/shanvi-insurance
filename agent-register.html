<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub-Agent Registration | Shanvi Insurance Services</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="logo">🛡️</div><div><b>Shanvi</b><span>Sub-Agent Network</span><small>Insurance Services</small></div></div><nav><a href="index.html">Website</a><a href="agent-login.html">Sub-Agent Login</a></nav></header><main class="login"><div class="form-card"><span class="eyebrow">BECOME A SHANVI SUB-AGENT</span><h1>Create Sub-Agent Account</h1><p class="muted-text">Apni User ID, Password aur email ke saath registration karein. Registration complete hote hi Sub-Agent certificate issue hoga; uske baad hi portal login active hoga.</p><form onsubmit="registerAgent(event)"><label>Full Name<input id="aName" required></label><label>Email Address<input id="aEmail" type="email" required></label><label>Mobile Number<input id="aMobile" inputmode="numeric" required></label><label>Create User ID<input id="aUid" required></label><label>Create Password<input id="aPass" type="password" minlength="6" required></label><button class="btn primary" style="width:100%;margin-top:8px">Issue Sub-Agent Certificate & Create Account</button></form><div id="agentRegMsg"></div></div></main><script src="script.js"></script></body></html>
