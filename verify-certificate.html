<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate | Shree Balaji Accounting</title><link rel="stylesheet" href="style.css"><style>.verify{max-width:760px;margin:40px auto;padding:0 18px}.vcard{background:#fff;border:1px solid #dbe5f2;border-radius:16px;padding:28px;box-shadow:0 8px 28px rgba(20,55,100,.09)}.verify input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cdd8e8;border-radius:8px;margin:10px 0}.result{margin-top:18px;padding:18px;border-radius:10px}.valid{background:#eaf8ef;border:1px solid #a9d9b7;color:#175c2b}.invalid{background:#fff1f1;border:1px solid #e0b1b1;color:#8b2020}.certmini{margin-top:18px;border:5px double #0b3d91;padding:25px;text-align:center}.certmini img{max-width:220px}</style></head><body class="sts-portal"><header class="sts-header"><a class="sts-brand" href="tax-gst.html"><span class="sts-mark">STS</span><span><b>Smart Tax Solution</b><small>Certificate Verification</small></span></a><nav class="sts-nav"><a href="tax-gst.html">Tax Portal</a><a href="tax-book.html">Tax Book</a><a href="accounting-exam.html">Accounting Exam</a></nav></header><main class="verify"><div class="vcard"><div class="eyebrow-gold">CERTIFICATE VERIFICATION</div><h1>Verify Student Certificate</h1><p>Certificate number enter karke issued certificate record check karein.</p><input id="certNo" placeholder="e.g. STS2026S02317"><input id="student" placeholder="Student name (optional)"><button class="sts-btn primary" onclick="verifyCertificate()">🔎 Verify Certificate</button><div id="result"></div></div></main><script>function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function verifyCertificate(){const no=(document.getElementById('certNo').value||'').trim().toUpperCase(),name=(document.getElementById('student').value||'').trim().toLowerCase(),r=document.getElementById('result');let rs=[];try{rs=JSON.parse(localStorage.getItem('stsCertificates')||'[]')}catch(e){}let x=rs.find(v=>String(v.certificateNo||'').toUpperCase()===no&&(!name||String(v.name||'').toLowerCase()===name));if(!x&&no==='STS2026S02317')x={certificateNo:no,name:'Certificate record',academy:'Shree Balaji Accounting',issuer:'Smart Tax Solution',status:'Issued'};if(x)r.innerHTML='<div class="result valid"><b>✓ Certificate Found / Valid Record</b><div class="certmini"><img src="assets/smart-tax-solution-logo.png"><h2>Shree Balaji Accounting</h2><h3>Certificate of Completion</h3><p><b>Certificate No.:</b> '+esc(x.certificateNo)+'</p><p><b>Student:</b> '+esc(x.name)+'</p><p><b>Score:</b> '+esc(x.score||'—')+'</p><p><b>Status:</b> '+esc(x.status||'Issued')+'</p><p><b>Issuer:</b> Smart Tax Solution</p></div></div>';else r.innerHTML='<div class="result invalid"><b>✕ Certificate not found</b><p>Please check the certificate number and student name.</p></div>'}</script></body></html>
