<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub-Agent Login | Shanvi Insurance Services</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="logo">🛡️</div><div><b>Shanvi</b><span>Sub-Agent Portal</span><small>Secure Partner Access</small></div></div><nav><a href="index.html">Website</a><a href="agent-register.html">Become a Sub-Agent</a></nav></header><main class="login"><div class="form-card"><span class="eyebrow">SUB-AGENT PORTAL</span><h1>Sub-Agent Login</h1><p class="muted-text">Certificate issue hone ke baad apni User ID aur Password se login karein.</p><form onsubmit="loginAgent(event)"><label>User ID<input id="aLoginUid" required></label><label>Password<input id="aLoginPass" type="password" required></label><button class="btn primary" style="width:100%">Login to Agent Portal</button></form><div id="agentLoginMsg"></div><div class="actions" style="justify-content:space-between"><a href="recovery.html">Forgot User ID?</a><a href="recovery.html">Forgot Password?</a></div><div class="notice" style="margin-top:15px">New Sub-Agent? <a href="agent-register.html"><b>Create your own Sub-Agent account →</b></a></div></div></main><script src="script.js"></script><script>if(new URLSearchParams(location.search).get('timeout')==='1'){const el=document.getElementById('agentLoginMsg')||document.getElementById('loginMsg')||document.getElementById('msg');if(el)el.innerHTML='<div class=\"error\">Security: 10 minutes of inactivity ke baad session logout ho gaya. Dobara login karein.</div>';}</script></body></html>
