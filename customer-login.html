<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Account | Shanvi</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="logo">🛡️</div><div><b>Shanvi</b><span>Customer Portal</span><small>Insurance Services</small></div></div><nav><a href="index.html">Website</a><a href="agent-login.html">Agent Portal</a></nav></header><main class="login"><div class="form-card"><span class="eyebrow">CUSTOMER LOGIN</span><h1>Welcome Back</h1><form onsubmit="loginCustomer(event)"><label>User ID<input id="cLoginUid" required></label><label>Password<input id="cLoginPass" type="password" required></label><button class="btn primary" style="width:100%">Customer Login</button></form><div id="loginMsg"></div><div class="actions" style="justify-content:space-between;margin-top:14px"><a href="recovery.html">Forgot User ID?</a><a href="recovery.html">Forgot Password?</a></div></div><div class="form-card" style="margin-top:18px"><span class="eyebrow">NEW CUSTOMER</span><h2>Create Account</h2><form onsubmit="registerCustomer(event)" class="form-grid"><label>Name<input id="cName" required></label><label>Email<input id="cEmail" type="email" required></label><label>Mobile<input id="cMobile" required></label><label>Create User ID<input id="cUid" required></label><label>Password<input id="cPass" type="password" minlength="6" required></label><button class="btn whatsapp full">Create Customer Account</button></form><div id="regMsg"></div></div></main><script src="supabase-config.js"></script><script src="script.js"></script><script>if(new URLSearchParams(location.search).get('timeout')==='1'){const el=document.getElementById('agentLoginMsg')||document.getElementById('loginMsg')||document.getElementById('msg');if(el)el.innerHTML='<div class=\"error\">Security: 10 minutes of inactivity ke baad session logout ho gaya. Dobara login karein.</div>';}</script></body></html>
