<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shanvi Admin | Server Control</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="logo">🛡️</div><div><b>Shanvi</b><span>Admin / Server</span><small>Owner Control</small></div></div><nav><a href="index.html">Website</a><a href="admin-portal.html">Admin Portal</a><a href="agent-portal.html">Agent Portal</a></nav></header><main class="panel"><div class="form-card"><span class="eyebrow">OWNER CONTROL</span><h1>Website Headline & Poster</h1><label>Headline 1<input id="h1" value="🎉 Raksha Bandhan Special — Protect your family & vehicle today"></label><label>Headline 2<input id="h2" value="💰 Agent Commission — Bike ₹75 | Car ₹210 per policy"></label><label>Headline 3<input id="h3" value="🛡️ Shanvi Insurance Services — Secure Today, Protected Tomorrow"></label><label>Festival / Promotion Poster<input id="poster" type="file" accept="image/*"></label><button class="btn primary" onclick="saveSiteSettings()">Save Website Settings</button><div id="setMsg"></div></div><div class="form-card" style="margin-top:20px"><h2>💳 PI Payment Verification</h2><p>Received PI requests ko check karke payment verified mark karein.</p><div id="requests"></div></div></main><script src="supabase-config.js"></script><script src="script.js"></script><script>async function saveSiteSettings(){let posterData=null;if(poster.files[0]){try{posterData=await fileDataURL(poster.files[0])}catch(e){msg('setMsg',e.message,'error');return}}const old=load('shanviSiteSettings',{});store('shanviSiteSettings',{headlines:[h1.value,h2.value,h3.value].filter(Boolean),poster:posterData||old.poster||null,updatedAt:new Date().toISOString()});msg('setMsg','Website settings saved. Poster और headlines browser storage में save हो गए.','success')}function renderRequests(){const a=load('shanviPIRequests',[]);requests.innerHTML=a.length?a.map((r,i)=>`<div class="request-row"><div><b>${r.name}</b> · ${r.vehicle}<br><small>${r.email} · UTR ${r.utr}<br>${new Date(r.submittedAt).toLocaleString('en-IN')}</small></div><button class="btn ${r.paymentVerified?'whatsapp':'primary'}" onclick="verifyPI(${i})">${r.paymentVerified?'Verified':'Verify Payment'}</button></div>`).join(''):'<div class="notice">No PI requests received.</div>'}function verifyPI(i){let a=load('shanviPIRequests',[]);a[i].paymentVerified=true;a[i].status='Payment Verified';a[i].verifiedAt=new Date().toISOString();store('shanviPIRequests',a);renderRequests()}renderRequests()</script></body></html>
