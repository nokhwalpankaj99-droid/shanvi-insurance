</section>

<script src="supabase-config.js"></script><script src="script.js"></script><script>
if(localStorage.getItem('shanviAdmin')!=='1' || !guardPortalSession('admin','admin-login.html')){}
function render(){const a=load('shanviAgents',[]),cst=load('shanviCustomers',[]),p=load('shanviPIRequests',[]),i=load('shanviInsuranceRequests',[]),v=load('shanviSiteVisits',[]),logs=load('shanviLoginHistory',[]);agentCount.textContent=a.length;customerCount.textContent=cst.length;piCount.textContent=p.length;insCount.textContent=i.length;verifiedCount.textContent=p.filter(x=>x.paymentVerified).length;visitCount.textContent=v.length;renderLoginActivity(logs);renderVisitSummary(v);siteVisits.innerHTML=v.length?v.slice().reverse().slice(0,30).map(x=>`<div class="request-row"><div><b>${x.customerName||'Guest'}</b> · ${x.customerEmail||'Not logged in'}<br><small>Page: ${x.page} · Visitor: ${x.visitorId}<br>${new Date(x.at).toLocaleString('en-IN')}</small></div><span class="notice">Visit</span></div>`).join(''):'<div class="notice">No site visits recorded yet.</div>';
agents.innerHTML=a.length?a.map((x,n)=>{let status=x.deactivated?'Deactivated':x.certificateRejected?'Certificate Rejected':x.certificateIssued?'Certificate Issued':'Pending Certificate';return `<div class="request-row"><div><b>${x.name}</b> · ${x.email}<br><small>Code: ${x.code||'Pending'} · User ID: ${x.uid} · Status: <b>${status}</b></small></div><div class="actions"><button class="btn primary" onclick="issueCert(${n})">${x.certificateIssued&&!x.certificateRejected?'View Certificate':'Issue / Re-issue'}</button><button class="btn whatsapp" onclick="creditCommission(${n})">+ Credit Commission</button>${!x.certificateRejected&&!x.deactivated?`<button class="btn danger" onclick="rejectCert(${n})">Reject Certificate</button>`:''}${x.deactivated?`<button class="btn whatsapp" onclick="activateAgent(${n})">Activate Account</button>`:`<button class="btn danger" onclick="deactivateAgent(${n})">Deactivate Account</button>`}</div></div>`}).join(''):'<div class="notice">No agent registrations yet.</div>';
piRequests.innerHTML=p.length?p.slice().reverse().map((x,ri)=>{const n=p.length-1-ri;return `<div class="request-row pi-admin-row"><div><b>${x.name}</b> · ${x.vehicle}<br><small>₹190 · UTR ${x.utr||'Not entered'} · ${new Date(x.submittedAt).toLocaleString('en-IN')}<br>Email: ${x.email} · Status: ${x.status||'Received'}</small><div class="doc-links">${x.files?.rc?.data?`<a href="${x.files.rc.data}" download="${x.files.rc.name}">RC</a>`:''}${x.files?.kyc?.map(f=>`<a href="${f.data}" download="${f.name}">KYC</a>`).join('')||''}${x.files?.photos?.map(f=>`<a href="${f.data}" download="${f.name}">Photo</a>`).join('')||''}${x.files?.video?.data?`<a href="${x.files.video.data}" download="${x.files.video.name}">Video</a>`:''}</div></div><div class="actions"><button class="btn ${x.paymentVerified?'whatsapp':'primary'}" onclick="verifyPI(${n})">${x.paymentVerified?'✓ Payment Verified':'Verify ₹190'}</button><label class="btn light dark-text upload-btn">📄 Upload PI PDF<input type="file" accept="application/pdf" hidden onchange="uploadPIPdf(${n},this)"></label>${x.piPdf?.data?`<a class="btn light dark-text" href="${x.piPdf.data}" download="${x.piPdf.name}">View PDF</a>`:''}</div></div>`}).join(''):'<div class="notice">No PI requests.</div>';
insuranceRequests.innerHTML=i.length?i.map(x=>`<div class="request-row"><div><b>${x.customer||'Customer'}</b> · ${x.vehicle||''}<br><small>${x.insurer||'Any insurer'} · ${x.cover||''}<br>${x.submittedAt?new Date(x.submittedAt).toLocaleString('en-IN'):''}</small></div><span class="notice">${x.status||'Received'}</span></div>`).join(''):'<div class="notice">No insurance requests.</div>'}
function renderLoginActivity(logs){
  const el=document.getElementById('loginActivity'); if(!el)return;
  if(!logs.length){el.innerHTML='<div class="notice">No login history. New successful logins will appear here.</div>';return}
  const counts={}; logs.forEach(x=>{const k=(x.role||'Unknown')+'|'+(x.uid||'');counts[k]=(counts[k]||0)+1});
  const summary=Object.entries(counts).map(([k,n])=>{const [role,uid]=k.split('|');const last=logs.slice().reverse().find(x=>(x.role||'Unknown')===role&&(x.uid||'')===uid);return `<div class="stat"><span>${role}</span><b>${n}</b><small>${uid} · last ${new Date(last.at).toLocaleString('en-IN')}</small></div>`}).join('');
  const recent=logs.slice().reverse().slice(0,50).map(x=>`<div class="request-row"><div><b>${x.name||x.uid}</b> · ${x.role||'Login'}<br><small>User ID: ${x.uid||'-'}${x.email?` · ${x.email}`:''}<br>${new Date(x.at).toLocaleString('en-IN')}</small></div><span class="notice">Login #${counts[(x.role||'Unknown')+'|'+(x.uid||'')]||1}</span></div>`).join('');
  el.innerHTML=`<div class="dashboard-grid" style="margin-bottom:14px">${summary}</div><div>${recent}</div>`;
}
function clearLoginHistory(){
  const logs=load('shanviLoginHistory',[]); if(!logs.length){alert('Login history already clean hai.');return}
  if(!confirm('Saari login history permanently clear karni hai?'))return;
  localStorage.removeItem('shanviLoginHistory'); render();
}

function issueCert(n){let a=load('shanviAgents',[]),u=a[n];if(!u)return;if(!u.code){u.code=nextAgentCode()}if(!u.certificateNo){u.certificateNo='SIS-CERT-'+u.code}if(!u.issuedAt||u.certificateRejected){u.issuedAt=new Date().toISOString()}u.certificateIssued=true;u.certificateRejected=false;u.rejectedAt=null;u.deactivated=false;a[n]=u;store('shanviAgents',a);store('shanviCurrentAgent',u.uid);location.href='agent-certificate.html?uid='+encodeURIComponent(u.uid)}
function rejectCert(n){let a=load('shanviAgents',[]),u=a[n];if(!u)return;if(!confirm('Certificate reject karna hai? Agent login disable ho jayega.'))return;u.certificateRejected=true;u.certificateIssued=false;u.rejectedAt=new Date().toISOString();a[n]=u;store('shanviAgents',a);render()}
function deactivateAgent(n){let a=load('shanviAgents',[]),u=a[n];if(!u)return;if(!confirm('Agent account deactivate karna hai?'))return;u.deactivated=true;u.deactivatedAt=new Date().toISOString();a[n]=u;store('shanviAgents',a);render()}
function activateAgent(n){let a=load('shanviAgents',[]),u=a[n];if(!u)return;u.deactivated=false;u.deactivatedAt=null;a[n]=u;store('shanviAgents',a);render()}
function verifyPI(n){let p=load('shanviPIRequests',[]);if(!p[n])return;p[n].paymentVerified=true;p[n].status='Payment Verified';p[n].verifiedAt=new Date().toISOString();store('shanviPIRequests',p);render()}
async function uploadPIPdf(n,input){const f=input.files[0];if(!f)return;if(f.type!=='application/pdf'){alert('Sirf PDF upload karein.');return}try{const d=await fileDataURL(f);let p=load('shanviPIRequests',[]);if(!p[n])return;p[n].piPdf={...d,uploadedAt:new Date().toISOString()};p[n].status='PI PDF Ready';store('shanviPIRequests',p);render()}catch(e){alert(e.message)}}
async function saveSettings(){let posterData=null;if(poster.files[0]){try{posterData=await fileDataURL(poster.files[0])}catch(e){document.getElementById('setMsg').innerHTML='<div class="error">'+e.message+'</div>';return}}const old=load('shanviSiteSettings',{});store('shanviSiteSettings',{headlines:[h1.value,h2.value,h3.value].filter(Boolean),poster:posterData||old.poster||null,posterName:poster.files[0]?.name||old.posterName||'',updatedAt:new Date().toISOString()});document.getElementById('setMsg').innerHTML='<div class="success">Settings saved successfully. Headline + poster saved.</div>'}
async function adminUploadPolicy(){const f=document.getElementById('adminPolicyPdf').files[0],uid=document.getElementById('adminPolicyCustomerUid').value.trim(),aid=document.getElementById('adminPolicyAgentUid').value.trim();if(!f||!uid){msg('adminPolicyMsg','Customer User ID aur Policy PDF required hai.','error');return}if(f.type!=='application/pdf'){msg('adminPolicyMsg','Sirf PDF upload karein.','error');return}try{const d=await fileDataURL(f);let policies=load('shanviPolicies',{});policies[uid]={name:f.name,data:d.data,uploadedAt:new Date().toISOString(),agent:aid||'',source:'Admin Portal'};store('shanviPolicies',policies);msg('adminPolicyMsg','Policy PDF successfully upload ho gayi. Customer aur Sub-Agent portal mein download available hai.','success');document.getElementById('adminPolicyPdf').value='';renderAdminPolicies()}catch(e){msg('adminPolicyMsg',e.message||'Upload failed.','error')}}
function renderAdminPolicies(){const el=document.getElementById('adminPolicyList');if(!el)return;const policies=load('shanviPolicies',{}),entries=Object.entries(policies);el.innerHTML=entries.length?entries.slice().reverse().map(([uid,x])=>`<div class="request-row"><div><b>${x.name||'Policy PDF'}</b><br><small>Customer UID: ${uid} · Sub-Agent UID: ${x.agent||'Not linked'}<br>Uploaded: ${new Date(x.uploadedAt).toLocaleString('en-IN')}</small></div><a class="btn light dark-text" href="${x.data}" download="${x.name||'policy.pdf'}">📥 Download</a></div>`).join(''):'<div class="notice">No policy PDFs uploaded yet.</div>'}
function renderCommissionRequests(){const el=document.getElementById('commissionRequestsAdmin');if(!el)return;const reqs=load('shanviCommissionRequests',[]);if(!reqs.length){el.innerHTML='<div class="notice">No commission payout requests yet.</div>';return}el.innerHTML=reqs.slice().reverse().map((x,ri)=>{const n=reqs.length-1-ri;return `<div class="request-row"><div><b>${x.agentName||x.agentUid}</b> · ${x.id}<br><small>Amount: ₹${Number(x.amount||0).toLocaleString('en-IN')} · UPI: <b>${x.upiId||'Not set'}</b><br>${x.note||''}<br>${new Date(x.requestedAt).toLocaleString('en-IN')} · Status: <b>${x.status||'Pending'}</b></small></div><div class="actions">${x.status==='Paid'?`<span class="success">✓ Paid</span>`:`<button class="btn whatsapp" onclick="markCommissionPaid(${n})">✓ Mark Paid</button>`}<button class="btn light dark-text" onclick="makePaymentSlip(${n})">🧾 ${x.status==='Paid'?'Payment Slip':'Create Slip'}</button></div></div>`}).join('')}
function markCommissionPaid(n){let a=load('shanviCommissionRequests',[]),x=a[n];if(!x)return;if(x.status==='Paid'){return}if(!confirm(`₹${Number(x.amount).toLocaleString('en-IN')} payment complete mark karein?`))return;x.status='Paid';x.paidAt=new Date().toISOString();a[n]=x;store('shanviCommissionRequests',a);makePaymentSlip(n,true);render()}
function creditCommission(n){let a=load('shanviAgents',[]),u=a[n];if(!u)return;let amount=Number(prompt(`Commission credit karein for ${u.name}. Amount (₹):`,'210'));if(!amount||amount<=0)return;let led=load('shanviCommissions',[]);led.push({entryId:'LED-'+Date.now(),agentUid:u.uid,agentName:u.name,amount,type:'Earned',note:'Admin credited commission',date:new Date().toISOString()});store('shanviCommissions',led);alert(`₹${amount.toLocaleString('en-IN')} commission ${u.name} ke wallet mein credit ho gaya.`);render()}
function renderVisitSummary(v){const el=document.getElementById('visitSummary');if(!el)return;const unique=new Set(v.map(x=>x.visitorId)).size,customers=new Set(v.filter(x=>x.customerUid).map(x=>x.customerUid)).size,guests=v.filter(x=>!x.customerUid).length;el.innerHTML=`<div class="stat"><span>Total Visits</span><b>${v.length}</b><small>all page visits</small></div><div class="stat"><span>Unique Visitors</span><b>${unique}</b><small>browser visitor IDs</small></div><div class="stat"><span>Customer Visits</span><b>${customers}</b><small>logged-in customers</small></div><div class="stat"><span>Guest Visits</span><b>${guests}</b><small>not logged in</small></div>`}
function clearSiteVisits(){const v=load('shanviSiteVisits',[]);if(!v.length){alert('Visit details already clean hain.');return}if(!confirm('Website / Customer Visit Details ko permanently clean karna hai?'))return;localStorage.removeItem('shanviSiteVisits');render()}
function makePaymentSlip(n,afterPaid=false){let a=load('shanviCommissionRequests',[]),x=a[n];if(!x)return;const paidDate=x.paidAt||new Date().toISOString();const agent=(load('shanviAgents',[]).find(a=>a.uid===x.agentUid)||{});const html=`<!doctype html><html><head><meta charset="utf-8"><title>Commission Payment Slip - ${x.id}</title><style>body{font-family:Arial,sans-serif;padding:40px;color:#102a56;background:#f7f9fc}.slip{max-width:720px;margin:auto;background:#fff;border:2px solid #173f9d;border-radius:18px;padding:34px;box-shadow:0 10px 30px #dfe6f2}.head{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:18px}.amount{font-size:30px;font-weight:800}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee}.sign{margin-top:45px}.btn{padding:12px 18px;border:0;border-radius:8px;background:#173f9d;color:#fff;cursor:pointer}@media print{body{background:#fff;padding:0}.slip{box-shadow:none}.btn{display:none}}</style></head><body><div class="slip"><div class="head"><div><h1>Shanvi Insurance Services</h1><div>Commission Payment Slip</div></div><div><b>${x.id}</b><br>${new Date(paidDate).toLocaleDateString('en-IN')}</div></div><div class="row"><b>Sub-Agent</b><span>${x.agentName||x.agentUid}</span></div><div class="row"><b>Agent Code</b><span>${agent.code||'—'}</span></div><div class="row"><b>UPI ID</b><span>${x.upiId||'—'}</span></div><div class="row"><b>Amount Paid</b><span class="amount">₹${Number(x.amount||0).toLocaleString('en-IN')}</span></div><div class="row"><b>Status</b><span>${x.status}</span></div><div class="row"><b>Paid On</b><span>${new Date(paidDate).toLocaleString('en-IN')}</span></div><div class="sign"><b>Authorised Signatory</b><br>Shanvi Insurance Services<br>${SHANVI.address}<br>${SHANVI.supportPhone} · ${SHANVI.supportEmail}</div><p style="margin-top:35px"><button class="btn" onclick="window.print()">Download / Save as PDF</button></p></div>

render();renderCommissionRequests()
