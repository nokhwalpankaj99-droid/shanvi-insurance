<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PI Document Upload • Shanvi</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand"><div class="brandmark">🛡️</div><div><b>Shanvi</b><span>PI Document Upload</span></div></div><nav><a href="index.html">Home</a><a class="active" href="pi-upload.html">PI Upload</a><a href="agent-portal.html">Agent Portal</a></nav><a class="call" href="tel:9664029638">☎ 96640-29638</a></header>
<main class="section"><div class="section-head"><div><span class="eyebrow">PRE-INSPECTION</span><h2>Submit PI Request</h2><p class="muted">Upload RC, KYC documents, vehicle photos and video. This demo saves the request in the browser only; email attachments require a backend/email service.</p></div></div>
<form class="quote-box" id="piForm"><div class="form-grid"><label>Customer Name<input required name="name"></label><label>Mobile Number<input required name="mobile" type="tel"></label><label>Vehicle Number<input required name="vehicle"></label><label>Request Date & Time<input name="datetime" type="datetime-local"></label></div>
<h3>Documents</h3><div class="upload-grid"><label class="upload">📄 RC Copy<input type="file" name="rc" accept=".pdf,.jpg,.jpeg,.png" required></label><label class="upload">🪪 KYC Documents<input type="file" name="kyc" accept=".pdf,.jpg,.jpeg,.png" multiple required></label><label class="upload">📷 Vehicle Photos<input type="file" name="photos" accept="image/*" multiple required></label><label class="upload">🎥 Vehicle Video<input type="file" name="video" accept="video/*" required></label></div>
<button class="btn primary" type="submit">📤 Submit PI Request</button><p id="piMsg"></p></form></main>
<script>document.querySelector('[name=datetime]').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);document.getElementById('piForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);let files=[];for(const [k,v] of f.entries())if(v instanceof File&&v.name)files.push(k+': '+v.name);let req={name:f.get('name'),mobile:f.get('mobile'),vehicle:f.get('vehicle'),datetime:f.get('datetime'),files};localStorage.setItem('lastPI',JSON.stringify(req));document.getElementById('piMsg').innerHTML='<b>Request saved locally.</b> '+files.length+' file entries recorded. To actually send attachments to nokhwalpankaj99@gmail.com, connect a secure backend/storage + email service.';});</script>
<style>.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-grid label{font-weight:800}.form-grid input{display:block;width:100%;padding:13px;border:1px solid #d5def0;border-radius:11px;margin-top:7px}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:15px 0 22px}.upload{border:2px dashed #cbd8ef;padding:25px;border-radius:16px;text-align:center;font-weight:900;color:#155ee1}.upload input{display:block;margin:12px auto 0;max-width:100%}@media(max-width:700px){.form-grid,.upload-grid{grid-template-columns:1fr}}</style></body></html>
